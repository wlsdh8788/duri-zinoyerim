      return aOngoing-bOngoing || (aOngoing===0?a.end.localeCompare(b.end):a.start.localeCompare(b.start));
    });
    return list.sort((a,b)=>a.start.localeCompare(b.start));
  }
  function card(e){
    const saved=isSaved(e),kind=longKind(e);
    const img=safeUrl(e.posterUrl||e.imageUrl||'');
    const hasImg=img!=='#';
    const id=escapeHtml(e.id),title=escapeHtml(e.title);
    const media=hasImg?`<img class="poster-backdrop" alt="" src="${img}" aria-hidden="true" loading="lazy"><img class="poster-img" src="${img}" alt="${title} 포스터" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.closest('.art').classList.remove('has-image');this.closest('.art').querySelectorAll('.poster-img,.poster-backdrop').forEach(n=>n.remove())">`:'';
    const art=`<div class="art ${escapeHtml(e.theme||'sea')} ${hasImg?'has-image':''}"><button type="button" class="art-open" data-detail="${id}" aria-label="${title} 상세보기">${media}<span class="emoji" aria-hidden="true">${escapeHtml(e.emoji||'🎉')}</span></button><button type="button" class="heart ${saved?'on':''}" data-fav="${id}" aria-label="${title} ${saved?'찜 해제':'찜하기'}" aria-pressed="${saved}">${saved?'♥':'♡'}</button></div>`;
    const tags=`<div class="tags"><span class="tag">${escapeHtml(regionLabel(e))}</span><span class="tag alt">${escapeHtml(e.category||'행사')}</span>${kind?`<span class="tag long-tag">${kind==='상설'?'상설':'장기'}</span>`:''}</div>`;
    return `<article class="event">${art}<div class="eventbody">${tags}<h3><button class="title-button" data-detail="${id}" type="button">${title}</button></h3><p class="meta date-meta">📅 ${escapeHtml(formatRange(e))}</p><p class="meta">📍 ${escapeHtml(e.place||e.address||regionLabel(e))}</p><div class="card-tail"><span class="price">${escapeHtml(e.price||'요금 확인')}</span><button class="more-detail" type="button" data-detail="${id}">자세히 ›</button></div></div></article>`;
  }
  function render(){
    const items=filtered();
    const typeLabels={all:'',축제:' · 축제',공연전시:' · 공연·전시'};
    const sectionLabels={upcoming:'다가오는 행사',longterm:'상설·장기 행사',favorites:'찜한 행사'};
    const dateLabels={upcoming:'',today:' · 오늘',tomorrow:' · 내일',weekend:' · 이번 주말',nextweekend:' · 다음 주말',custom:' · 선택 날짜'};
    E('results-title').firstChild.textContent=sectionLabels[currentSection]+(currentSection==='upcoming'?dateLabels[currentPeriod]:'')+(typeLabels[currentFilter]||'')+' ';
    E('count').textContent=`${items.length}건`;
    E('sectionHelp').textContent=({upcoming:'상설·장기 행사는 별도 메뉴에서 확인할 수 있어.',longterm:'30일 이상 또는 상설 운영 행사를 모아봤어.',favorites:'이 기기에 저장한 관심 행사를 모아봤어.'})[currentSection];
    E('dateFilter').hidden=currentSection!=='upcoming';
    E('loadMore').hidden=items.length<=visibleLimit;
    E('loadMore').textContent=`더 보기 (${Math.min(visibleLimit,items.length)}/${items.length}) ＋`;
    let empty='조건에 맞는 행사가 없어. 지역이나 날짜를 변경해 봐.';
    if(currentSection==='favorites')empty='아직 찜한 행사가 없어. 포스터의 ♡를 눌러 저장해 봐.';
    else if(currentSection==='longterm')empty='조건에 맞는 상설·장기 행사가 없어.';
    E('cards').innerHTML=items.length?items.slice(0,visibleLimit).map(card).join(''):`<div class="empty" style="grid-column:1/-1">${empty}</div>`;
  }
  function showDetail(id){
    const e=EVENTS.find(x=>x.id===id);if(!e)return;
    const img=safeUrl(e.posterUrl||e.imageUrl||'');
    const media=img!=='#'?`<img src="${img}" alt="${escapeHtml(e.title)} 포스터" referrerpolicy="no-referrer">`:`<span class="emoji" aria-hidden="true">${escapeHtml(e.emoji||'🎉')}</span>`;
    const row=(k,v)=>`<dt>${k}</dt><dd>${escapeHtml(v||'확인 필요')}</dd>`;
    const maps='https://map.naver.com/p/search/'+encodeURIComponent(e.mapQuery||e.place||e.city||e.title);
    const official=safeUrl(e.sourceUrl);
    E('dialogContent').innerHTML=`<div class="modal-photo">${media}</div><div class="modal-body"><div class="modal-kicker">${escapeHtml(regionLabel(e))} · ${escapeHtml(e.category||'행사')}</div><h2>${escapeHtml(e.title)}</h2><dl class="modal-info">${row('기간',formatRange(e))}${row('장소',e.place||e.address)}${row('요금',e.price||'요금 확인 필요')}</dl><div class="modal-summary">${escapeHtml([e.intro,e.highlight,e.note].filter(Boolean).join('\n\n')||'세부 내용은 공식 사이트에서 확인할 수 있어.')}</div><div class="modal-links"><a target="_blank" rel="noopener noreferrer" href="${official}">공식 정보·예매 ↗</a><a target="_blank" rel="noopener noreferrer" href="${safeUrl(maps)}">지도에서 보기 ↗</a></div><div class="modal-source">출처: ${escapeHtml(e.sourceLabel||'제공처 미확인')} · 일정과 가격은 방문 전 공식 안내 확인</div></div>`;
    E('detailDialog').showModal();
    E('modalClose').focus();
  }
  function setDatePeriod(value){
    currentPeriod=value;
    visibleLimit=8;
    E('dateInputWrap').hidden=value!=='custom';
    document.querySelectorAll('[data-date]').forEach(el=>{const active=el.dataset.date===value;el.classList.toggle('active',active);el.setAttribute('aria-pressed',String(active));});
    if(value==='custom'&&!E('customDate').value)E('customDate').value=stamp(today);
    render();
  }
  document.addEventListener('click',ev=>{
    const fav=ev.target.closest('[data-fav]');
    if(fav){const id=fav.dataset.fav,event=EVENTS.find(x=>x.id===id),allIds=event?[event.id,...(event.relatedIds||[])]:[id];const wasSaved=event?isSaved(event):favoriteIds.includes(id);favoriteIds=wasSaved?favoriteIds.filter(x=>!allIds.includes(x)):[...favoriteIds.filter(x=>!allIds.includes(x)),id];persist();render();toast(wasSaved?'찜 목록에서 뺐어':'데이트 후보에 저장했어 ♥');return;}
    const detail=ev.target.closest('[data-detail]');if(detail){showDetail(detail.dataset.detail);return;}
    const date=ev.target.closest('[data-date]');if(date){setDatePeriod(date.dataset.date);}
  });
  E('modalClose').addEventListener('click',()=>E('detailDialog').close());
  E('detailDialog').addEventListener('click',ev=>{if(ev.target===E('detailDialog'))E('detailDialog').close()});
  E('search').addEventListener('input',()=>{visibleLimit=8;render()});
  E('city').addEventListener('change',()=>{visibleLimit=8;render()});
  E('province').addEventListener('change',()=>{visibleLimit=8;updateCityOptions();render()});
  E('customDate').addEventListener('change',()=>setDatePeriod('custom'));
  E('customDate').min=stamp(today);
  document.querySelectorAll('[data-section]').forEach(btn=>btn.addEventListener('click',()=>{
    currentSection=btn.dataset.section;currentFilter='all';visibleLimit=8;
    document.querySelectorAll('[data-section]').forEach(el=>{const active=el===btn;el.classList.toggle('active',active);el.setAttribute('aria-pressed',String(active))});
    document.querySelectorAll('[data-filter]').forEach(el=>el.classList.toggle('active',el.dataset.filter==='all'));
    render();
  }));
  document.querySelectorAll('[data-filter]').forEach(btn=>btn.addEventListener('click',()=>{currentFilter=btn.dataset.filter;visibleLimit=8;document.querySelectorAll('[data-filter]').forEach(el=>el.classList.toggle('active',el===btn));render()}));
  E('loadMore').addEventListener('click',()=>{visibleLimit+=8;render()});
  async function shareText(){const saved=EVENTS.filter(isSaved);const items=saved.length?saved:filtered();if(!items.length){toast('공유할 행사가 없어. 검색 조건을 바꿔 봐.');return}const text='♡ 우리 데이트 후보 ♡\n\n'+items.map(e=>`• ${e.title}\n  ${formatRange(e)} · ${regionLabel(e)} · ${e.place}\n  ${e.sourceUrl}`).join('\n\n')+'\n\n※ 방문 전 공식 안내를 확인해 줘.';try{if(navigator.share){await navigator.share({title:'우리 데이트 후보',text});return}}catch(err){if(err.name==='AbortError')return}try{await navigator.clipboard.writeText(text);toast('데이트 후보를 복사했어. 카톡에 붙여넣으면 돼!')}catch(err){const field=document.createElement('textarea');field.value=text;document.body.appendChild(field);field.select();try{document.execCommand('copy');toast('데이트 후보를 복사했어. 카톡에 붙여넣으면 돼!')}catch(x){toast('복사에 실패했어. 브라우저에서 다시 시도해 줘.')}field.remove()}}
  E('shareAll').addEventListener('click',shareText);
  async function loadEvents(){
    try {
      // Published hosting serves current events.json; file:// cannot fetch, so offline demo uses embedded examples.
      if(location.protocol==='file:') throw new Error('로컬 파일 모드');
      const res=await fetch('./events.json?nocache='+Date.now(),{cache:'no-store'});
      if(!res.ok) throw new Error('HTTP '+res.status);
      const payload=await res.json();
      if(!Array.isArray(payload.events)) throw new Error('events 배열 누락');
      const valid=payload.events.filter(e=>e && e.id && e.title && /^\d{4}-\d{2}-\d{2}$/.test(e.start||'') && /^\d{4}-\d{2}-\d{2}$/.test(e.end||'') && e.end>=e.start && e.city);
      EVENTS=cleanForDisplay(valid);
      updateCityOptions();
      const removed=Math.max(0,Number(payload.deduplication?.raw_count??valid.length)-EVENTS.length);
      E('dataStatus').textContent=`자료 기준 ${payload.updated||'미확인'} · 화면 ${EVENTS.length}건${removed>0?' (중복 '+removed+'건 정리)':''} · ${payload.auto_update?'공식 API 수집 활성화':'API 미연결 · 수동 등록 자료'}`;
    }catch(err){E('dataStatus').textContent='내장된 예시 자료 표시 중 · 실시간 갱신 아님 ('+err.message+')';}
    render();
  }
  EVENTS=cleanForDisplay(EVENTS);
  updateCityOptions();
  loadEvents();
  </script>
</body></html>
