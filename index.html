자치도 평창군 진부면 경강로 3562", "price": "유료 · 2027년 요금 확인 필요", "priceType": "paid", "emoji": "🐟", "theme": "winter", "intro": "겨울 얼음낚시와 각종 체험을 즐기는 대표 겨울축제. 2027년 상세 프로그램은 갱신 중.", "highlight": "이색 체험 + 겨울 나들이", "status": "세부 일정 확인 필요", "sourceLabel": "한국관광공사 축제 정보", "sourceUrl": "https://app.visitkorea.or.kr/kfes/detail/fstvlDetail.do?fstvlCntntsId=e79ad504-4e44-46d4-950c-cff9292665c1", "mapQuery": "평창송어축제장", "note": "한국관광공사에 1.1~1.31 기재. 2027년 상세내용은 변경 가능", "collectionMethod": "수동 확인", "lastVerified": "2026-11-19"}];

  function filtered(){
    const q=E('search').value.trim().toLowerCase(),city=E('city').value,period=E('period').value;
    const day=today.getDay(),offset=(6-day+7)%7;
    const saturday=new Date(today);saturday.setDate(today.getDate()+offset);
    const sunday=new Date(saturday);sunday.setDate(saturday.getDate()+1);

    return EVENTS.filter(e=>{
      const start=parse(e.start),end=parse(e.end);
      if(city!=='all'&&e.city!==city)return false;
      if(currentFilter==='favorites'){if(!favoriteIds.includes(e.id))return false}
      else if(currentFilter!=='all'&&e.category!==currentFilter)return false;

      return true;
    }).sort((a,b)=>a.start.localeCompare(b.start));
  }
  function card(e){const saved=favoriteIds.includes(e.id);return `<article class="event"><div class="art ${e.theme}"><span class="date-ribbon">${escapeHtml(formatRange(e))}</span><div class="emoji" aria-hidden="true">${e.emoji}</div><button type="button" class="heart ${saved?'on':''}" data-fav="${e.id}" aria-label="${escapeHtml(e.title)} ${saved?'찜 해제':'찜하기'}" aria-pressed="${saved}">${saved?'♥':'♡'}</button></div><div class="eventbody"><div class="tags"><span class="tag">${escapeHtml(e.city)}</span><span class="tag alt">${escapeHtml(e.category)}</span></div><h3>${escapeHtml(e.title)}</h3><p class="meta">📍 ${escapeHtml(e.place)}</p><p class="meta">🎟️ ${escapeHtml(e.price)}</p><p class="meta">🔎 ${escapeHtml(e.collectionMethod || e.sourceLabel || "자료 출처 확인")} · ${escapeHtml(e.status || "출처 확인 권장")}</p><p class="intro">${escapeHtml(e.intro)}</p><div class="highlight">♥ ${escapeHtml(e.highlight)}</div><div class="cardactions"><a class="detail" href="${safeUrl(e.sourceUrl)}" target="_blank" rel="noopener noreferrer" title="${escapeHtml(e.note)}">행사 확인 ↗</a><a class="map" href="https://map.naver.com/p/search/${encodeURIComponent(e.mapQuery)}" target="_blank" rel="noopener noreferrer">지도 보기 ↗</a></div></div></article>`}
  function monthCells(items){const first=new Date(monthCursor.getFullYear(),monthCursor.getMonth(),1);const start=new Date(first);start.setDate(first.getDate()-first.getDay());let html='<div class="calgrid">'+['일','월','화','수','목','금','토'].map(d=>`<div class="dayname">${d}</div>`).join('');for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);const isMonth=d.getMonth()===first.getMonth(),isToday=d.toDateString()===today.toDateString();const date=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');const active=items.filter(e=>e.start<=date&&e.end>=date);html+=`<div class="calcell ${isMonth?'':'dim'} ${isToday?'today':''}"><div class="num">${d.getDate()}</div>`+active.map(e=>`<a class="calEvent" target="_blank" rel="noopener noreferrer" href="${safeUrl(e.sourceUrl)}" title="${escapeHtml(e.title)}">${escapeHtml(e.title)}</a>`).join('')+'</div>'}return html+'</div>'}
  function render(){const items=filtered();E('count').textContent=`${items.length}건`;E('cardView').classList.toggle('active',view==='cards');E('calendarView').classList.toggle('active',view==='calendar');E('cards').hidden=view!=='cards';E('cal').hidden=view!=='calendar';if(view==='cards')E('cards').innerHTML=items.length?items.map(card).join(''):'<div class="empty" style="grid-column:1/-1">조건에 맞는 행사가 없어. 지역이나 기간을 바꿔 봐.</div>';else{E('cal').innerHTML=`<div class="calhead"><strong>${monthCursor.getFullYear()}년 ${monthCursor.getMonth()+1}월</strong><div><button type="button" data-month="-1" aria-label="이전 달">‹</button> <button type="button" data-month="1" aria-label="다음 달">›</button></div></div>`+monthCells(items)}}
  document.addEventListener('click',ev=>{const fav=ev.target.closest('[data-fav]');if(fav){const id=fav.dataset.fav;favoriteIds=favoriteIds.includes(id)?favoriteIds.filter(x=>x!==id):[...favoriteIds,id];persist();render();toast(favoriteIds.includes(id)?'데이트 후보에 저장했어 ♥':'찜 목록에서 뺐어');return}const mon=ev.target.closest('[data-month]');if(mon){monthCursor=new Date(monthCursor.getFullYear(),monthCursor.getMonth()+Number(mon.dataset.month),1);render()}});
  E('search').addEventListener('input',render);E('city').addEventListener('change',render);E('period').addEventListener('change',render);
  document.querySelectorAll('[data-filter]').forEach(btn=>btn.addEventListener('click',()=>{currentFilter=btn.dataset.filter;document.querySelectorAll('[data-filter]').forEach(el=>el.classList.toggle('active',el===btn));render()}));
  E('cardView').addEventListener('click',()=>{view='cards';render()});E('calendarView').addEventListener('click',()=>{view='calendar';render()});
  async function shareText(){const saved=EVENTS.filter(e=>favoriteIds.includes(e.id));const items=saved.length?saved:filtered();if(!items.length){toast('공유할 행사가 없어. 검색 조건을 바꿔 봐.');return}const text='♡ 우리 강원도 데이트 후보 ♡\n\n'+items.map(e=>`• ${e.title}\n  ${formatRange(e)} · ${e.city} · ${e.place}\n  ${e.sourceUrl}`).join('\n\n')+'\n\n※ 방문 전 공식 안내를 확인해 줘.';try{if(navigator.share){await navigator.share({title:'우리 강원도 데이트 후보',text});return}}catch(err){if(err.name==='AbortError')return}try{await navigator.clipboard.writeText(text);toast('데이트 후보를 복사했어. 카톡에 붙여넣으면 돼!')}catch(err){const field=document.createElement('textarea');field.value=text;document.body.appendChild(field);field.select();try{document.execCommand('copy');toast('데이트 후보를 복사했어. 카톡에 붙여넣으면 돼!')}catch(x){toast('복사에 실패했어. 브라우저에서 다시 시도해 줘.')}field.remove()}}
  E('shareAll').addEventListener('click',shareText);
  async function loadEvents(){
    try {
      // Published hosting serves current events.json; file:// cannot fetch, so offline demo uses embedded examples.
      if(location.protocol==='file:') throw new Error('로컬 파일 모드');
      const res=await fetch('./events.json?nocache='+Date.now(),{cache:'no-store'});
      if(!res.ok) throw new Error('HTTP '+res.status);
      const payload=await res.json();
      if(!Array.isArray(payload.events)) throw new Error('events 배열 누락');
      const valid=payload.events.filter(e=>e && e.id && e.title && /^\d{4}-\d{2}-\d{2}$/.test(e.start||'') && /^\d{4}-\d{2}-\d{2}$/.test(e.end||'') && e.end>=e.start && e.city);
      EVENTS=valid;
      E('dataStatus').textContent=`자료 기준 ${payload.updated||'미확인'} · 등록 ${EVENTS.length}건 · ${payload.auto_update?'공식 API 수집 활성화':'API 미연결 · 수동 등록 자료'} · 방문 전 공식 출처 확인`;
    }catch(err){E('dataStatus').textContent='내장된 예시 자료 표시 중 · 실시간 갱신 아님 ('+err.message+')';}
    render();
  }
  loadEvents();
  </script>
</body></html>
