자치도 평창군 진부면 경강로 3562", "price": "유료 · 2027년 요금 확인 필요", "priceType": "paid", "emoji": "🐟", "theme": "winter", "intro": "겨울 얼음낚시와 각종 체험을 즐기는 대표 겨울축제. 2027년 상세 프로그램은 갱신 중.", "highlight": "이색 체험 + 겨울 나들이", "status": "세부 일정 확인 필요", "sourceLabel": "한국관광공사 축제 정보", "sourceUrl": "https://app.visitkorea.or.kr/kfes/detail/fstvlDetail.do?fstvlCntntsId=e79ad504-4e44-46d4-950c-cff9292665c1", "mapQuery": "평창송어축제장", "note": "한국관광공사에 1.1~1.31 기재. 2027년 상세내용은 변경 가능", "collectionMethod": "수동 확인", "lastVerified": "2026-11-19"}];
  const today = new Date();today.setHours(0,0,0,0);
  const fmt = new Intl.DateTimeFormat('ko-KR',{month:'short',day:'numeric'});
  const parse = s=>new Date(s+'T00:00:00');
  const formatRange=e=>fmt.format(parse(e.start))+' ~ '+fmt.format(parse(e.end));
  const escapeHtml=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
  const safeUrl=s=>{try{const u=new URL(s);return ['https:','http:'].includes(u.protocol)?escapeHtml(u.href):'#'}catch(e){return '#'}};
  const E = id=>document.getElementById(id);
  let favoriteIds=[];try{favoriteIds=JSON.parse(localStorage.getItem('ourGangwonSaved')||'[]')}catch(err){favoriteIds=[]}
  if(!Array.isArray(favoriteIds))favoriteIds=[];
  let currentFilter='recommend',view='cards',visibleLimit=8,monthCursor=new Date(today.getFullYear(),today.getMonth(),1);
  const persist=()=>{try{localStorage.setItem('ourGangwonSaved',JSON.stringify(favoriteIds))}catch(err){}};
  let toastTimer;
  function toast(msg){clearTimeout(toastTimer);E('toast').textContent=msg;E('toast').style.display='block';toastTimer=setTimeout(()=>E('toast').style.display='none',3400)}
  const provinceNames = [['서울특별시','서울'],['부산광역시','부산'],['대구광역시','대구'],['인천광역시','인천'],['광주광역시','광주'],['대전광역시','대전'],['울산광역시','울산'],['세종특별자치시','세종'],['경기도','경기'],['강원특별자치도','강원'],['강원도','강원'],['충청북도','충북'],['충청남도','충남'],['전북특별자치도','전북'],['전라북도','전북'],['전라남도','전남'],['경상북도','경북'],['경상남도','경남'],['제주특별자치도','제주']];
  function eventProvince(e){
    if(e.province)return e.province;
    const address=e.address||'';
    for(const [full,short] of provinceNames)if(address.startsWith(full))return short;
    if(['강릉','동해','속초','양양','삼척','평창','춘천','원주','홍천','횡성','태백','정선','영월','인제','고성','철원','화천','양구'].includes(e.city))return '강원';
    return '기타';
  }
  function updateCityOptions(){
    const province=E('province').value;
    const selected=E('city').value;
    const cities=[...new Set(EVENTS.filter(e=>province==='all'||eventProvince(e)===province).map(e=>e.city).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko'));
    E('city').replaceChildren(new Option('시·군·구 전체','all'),...cities.map(c=>new Option(c,c)));
    E('city').value=cities.includes(selected)?selected:'all';
  }
  function durationDays(e){return Math.round((parse(e.end)-parse(e.start))/86400000)+1}
  function longKind(e){
    if(e.isPermanent===true || e.eventType==='상설' || /상설\s*(전시|공연|체험|운영)|상시\s*(운영|개방)/.test(e.title||''))return '상설';
    if(durationDays(e)>=60)return '장기';
    return '';
  }
  function visible(e){
    const q=E('search').value.trim().toLowerCase(),province=E('province').value,city=E('city').value,period=E('period').value;
    const day=today.getDay(),offset=(6-day+7)%7;
    const saturday=new Date(today);saturday.setDate(today.getDate()+offset);
    const sunday=new Date(saturday);sunday.setDate(saturday.getDate()+1);
    const monthEnd=new Date(today.getFullYear(),today.getMonth()+1,0);
    const start=parse(e.start),end=parse(e.end);
    if(province!=='all'&&eventProvince(e)!==province)return false;
    if(city!=='all'&&e.city!==city)return false;
    if(currentFilter==='recommend'){
      if(longKind(e))return false;
    }else if(currentFilter==='favorites'){
      if(!favoriteIds.includes(e.id))return false;
    }else if(currentFilter==='longterm'){
      if(!longKind(e))return false;
    }else if(currentFilter!=='all' && e.category!==currentFilter)return false;
    if(q&&![e.title,eventProvince(e),e.city,e.place,e.intro,e.highlight].join(' ').toLowerCase().includes(q))return false;
    if(period==='upcoming'&&end<today)return false;
    if(period==='weekend'&&(end<saturday||start>sunday))return false;
    if(period==='month'&&(end<today||start>monthEnd))return false;
    return true;
  }
  function filtered(){
    const list=EVENTS.filter(visible);
    if(currentFilter==='recommend'){
      return list.sort((a,b)=>{
        const score=e=>{
          const days=Math.max(0,(parse(e.start)-today)/86400000);
          const ongoing=parse(e.start)<=today&&parse(e.end)>=today;
          return (ongoing?0:Math.min(days,120)*.8) + (eventProvince(e)==='강원'&&E('province').value==='all'?-10:0) - (e.posterUrl||e.imageUrl?6:0) + (durationDays(e)>30?7:0);
        };
        return score(a)-score(b) || a.start.localeCompare(b.start);
      });
    }
    return list.sort((a,b)=>a.start.localeCompare(b.start));
  }
  function card(e){
    const saved=favoriteIds.includes(e.id),kind=longKind(e);
    const img=safeUrl(e.posterUrl||e.imageUrl||'');
    const showImage=img!=='#';
    const art=`<div class="art ${escapeHtml(e.theme||'sea')} ${showImage?'has-image':''}">
       ${showImage?`<img class="poster-backdrop" alt="" src="${img}" aria-hidden="true"><img class="poster-img" loading="lazy" decoding="async" referrerpolicy="no-referrer" src="${img}" alt="${escapeHtml(e.title)} ${escapeHtml(e.imageType||'공식 이미지')}" onerror="this.closest('.art').classList.remove('has-image');this.remove()">`:''}
       <span class="date-ribbon">${escapeHtml(formatRange(e))}</span><div class="emoji" aria-hidden="true">${escapeHtml(e.emoji||'🎉')}</div>
       <button type="button" class="heart ${saved?'on':''}" data-fav="${escapeHtml(e.id)}" aria-label="${escapeHtml(e.title)} ${saved?'찜 해제':'찜하기'}" aria-pressed="${saved}">${saved?'♥':'♡'}</button></div>`;
    const kindTag=kind?`<span class="tag long-tag">${kind==='상설'?'상설 운영':'장기 진행'}</span>`:'';
    const current=parse(e.start)<=today&&parse(e.end)>=today;
    return `<article class="event">${art}<div class="eventbody"><div class="tags"><span class="tag">${escapeHtml(eventProvince(e)+' · '+e.city)}</span><span class="tag alt">${escapeHtml(e.category)}</span>${kindTag}${current?'<span class="tag active-tag">진행 중</span>':''}</div><h3>${escapeHtml(e.title)}</h3><p class="meta">📍 ${escapeHtml(e.place||e.address||e.city)}</p><p class="meta">🎟️ ${escapeHtml(e.price||'요금 확인 필요')}</p><p class="intro">${escapeHtml(e.intro||'방문 전 공식 일정과 예약 조건을 확인해 줘.')}</p><div class="cardactions"><a class="detail" href="${safeUrl(e.sourceUrl)}" target="_blank" rel="noopener noreferrer" title="공식 정보 확인">상세·예매 ↗</a><a class="map" href="https://map.naver.com/p/search/${encodeURIComponent(e.mapQuery||e.place||e.city)}" target="_blank" rel="noopener noreferrer">지도 보기 ↗</a></div><div class="verified">출처: ${escapeHtml(e.sourceLabel||'제공처 확인')} · ${escapeHtml(e.imageType|| (showImage?'대표 이미지':'기본 그래픽'))}</div></div></article>`;
  }
  function monthCells(items){const first=new Date(monthCursor.getFullYear(),monthCursor.getMonth(),1);const start=new Date(first);start.setDate(first.getDate()-first.getDay());let html='<div class="calgrid">'+['일','월','화','수','목','금','토'].map(d=>`<div class="dayname">${d}</div>`).join('');for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);const isMonth=d.getMonth()===first.getMonth(),isToday=d.toDateString()===today.toDateString();const date=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');const active=items.filter(e=>e.start<=date&&e.end>=date);html+=`<div class="calcell ${isMonth?'':'dim'} ${isToday?'today':''}"><div class="num">${d.getDate()}</div>`+active.map(e=>`<a class="calEvent" target="_blank" rel="noopener noreferrer" href="${safeUrl(e.sourceUrl)}" title="${escapeHtml(e.title)}">${escapeHtml(e.title)}</a>`).join('')+'</div>'}return html+'</div>'}
  function render(){
    const items=filtered();
    const name={recommend:'이번에 가볼 만한 곳',all:'전체 일정',longterm:'상설·장기 행사',favorites:'찜한 데이트',축제:'축제',공연:'공연·콘서트',전시:'전시·미술',팝업:'팝업스토어',체험:'체험',야경:'야경·빛축제'};
    E('results-title').firstChild.textContent=(name[currentFilter]||'가볼 만한 행사')+' ';
    E('count').textContent=`${items.length}건`;
    E('cardView').classList.toggle('active',view==='cards');E('calendarView').classList.toggle('active',view==='calendar');
    E('cards').hidden=view!=='cards';E('cal').hidden=view!=='calendar';
    E('loadMore').hidden=(view!=='cards'||items.length<=visibleLimit);
    E('loadMore').textContent=`행사 더 보기 (${Math.min(visibleLimit,items.length)}/${items.length}) ＋`;
    if(view==='cards'){
      let empty='조건에 맞는 행사가 없어. 지역이나 기간을 바꿔 봐.';
      if(currentFilter==='공연')empty='공연 자동 수집은 KOPIS 인증키가 연결되면 늘어날 수 있어. 현재는 등록된 공연이 없어.';
      if(currentFilter==='전시')empty='전시 자동 수집은 문화포털 API가 추가로 연결돼야 해. 지금은 등록된 전시가 없어.';
      E('cards').innerHTML=items.length?items.slice(0,visibleLimit).map(card).join(''):`<div class="empty" style="grid-column:1/-1">${empty}</div>`;
    }else{
      E('cal').innerHTML=`<div class="calhead"><strong>${monthCursor.getFullYear()}년 ${monthCursor.getMonth()+1}월</strong><div><button type="button" data-month="-1" aria-label="이전 달">‹</button> <button type="button" data-month="1" aria-label="다음 달">›</button></div></div>`+monthCells(items);
    }
  }
  document.addEventListener('click',ev=>{const fav=ev.target.closest('[data-fav]');if(fav){const id=fav.dataset.fav;favoriteIds=favoriteIds.includes(id)?favoriteIds.filter(x=>x!==id):[...favoriteIds,id];persist();render();toast(favoriteIds.includes(id)?'데이트 후보에 저장했어 ♥':'찜 목록에서 뺐어');return}const mon=ev.target.closest('[data-month]');if(mon){monthCursor=new Date(monthCursor.getFullYear(),monthCursor.getMonth()+Number(mon.dataset.month),1);render()}});
  E('search').addEventListener('input',()=>{visibleLimit=8;render()});E('city').addEventListener('change',()=>{visibleLimit=8;render()});E('province').addEventListener('change',()=>{visibleLimit=8;updateCityOptions();render()});E('period').addEventListener('change',()=>{visibleLimit=8;render()});
  document.querySelectorAll('[data-filter]').forEach(btn=>btn.addEventListener('click',()=>{currentFilter=btn.dataset.filter;visibleLimit=8;document.querySelectorAll('[data-filter]').forEach(el=>el.classList.toggle('active',el===btn));render()}));
  E('loadMore').addEventListener('click',()=>{visibleLimit+=8;render()});
  E('cardView').addEventListener('click',()=>{view='cards';render()});E('calendarView').addEventListener('click',()=>{view='calendar';render()});
  async function shareText(){const saved=EVENTS.filter(e=>favoriteIds.includes(e.id));const items=saved.length?saved:filtered();if(!items.length){toast('공유할 행사가 없어. 검색 조건을 바꿔 봐.');return}const text='♡ 우리 데이트 후보 ♡\n\n'+items.map(e=>`• ${e.title}\n  ${formatRange(e)} · ${e.city} · ${e.place}\n  ${e.sourceUrl}`).join('\n\n')+'\n\n※ 방문 전 공식 안내를 확인해 줘.';try{if(navigator.share){await navigator.share({title:'우리 데이트 후보',text});return}}catch(err){if(err.name==='AbortError')return}try{await navigator.clipboard.writeText(text);toast('데이트 후보를 복사했어. 카톡에 붙여넣으면 돼!')}catch(err){const field=document.createElement('textarea');field.value=text;document.body.appendChild(field);field.select();try{document.execCommand('copy');toast('데이트 후보를 복사했어. 카톡에 붙여넣으면 돼!')}catch(x){toast('복사에 실패했어. 브라우저에서 다시 시도해 줘.')}field.remove()}}
  E('shareAll').addEventListener('click',shareText);
  async function loadEvents(){
    try {
      // Published hosting serves current events.json; file:// cannot fetch, so offline demo uses embedded examples.
      if(location.protocol==='file:') throw new Error('로컬 파일 모드');
      const res=await fetch('./events.json?nocache='+Date.now(),{cache:'no-store'});
      if(!res.ok) throw new Error('HTTP '+res.status);
      const payload=await res.json();
      if(!Array.isArray(payload.events)) throw new Error('events 배열 누락');
      const valid=payload.events.filter(e=>e && e.id && e.title && /^\d{4}-\d{2}-\d{2}$/.test(e.start||'') && /^\d{4}-\d{2}-\d{2}$/.test(e.end||'') && e.end>=e.start && e.city);
      EVENTS=valid;
      updateCityOptions();
      E('dataStatus').textContent=`자료 기준 ${payload.updated||'미확인'} · 등록 ${EVENTS.length}건 · ${payload.auto_update?'공식 API 수집 활성화':'API 미연결 · 수동 등록 자료'} · 방문 전 공식 출처 확인`;
    }catch(err){E('dataStatus').textContent='내장된 예시 자료 표시 중 · 실시간 갱신 아님 ('+err.message+')';}
    render();
  }
  updateCityOptions();
  loadEvents();
  </script>
</body></html>
