
name: Update and publish Gangwon dates

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 22 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gangwon-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate football updater
        run: |
          python -m py_compile scripts/update_sports.py
          python -m unittest discover -s tests -p 'test_update_sports.py'

      - name: Validate musical selection rules
        run: |
          python -m py_compile scripts/update_musicals.py scripts/update_events.py
          python -m unittest discover -s tests -p 'test_update_musicals.py'

      - name: Validate popular concert updater
        run: |
          python -m py_compile scripts/update_concerts.py
          python -m unittest discover -s tests -p 'test_update_concerts.py'

      - name: Validate food discovery page
        run: |
          python -m unittest discover -s tests -p 'test_food_page.py'
          node --check food.js

      - name: Refresh football schedule
        if: github.event_name != 'push'
        run: python scripts/update_sports.py

      - name: Refresh event data
        if: github.event_name != 'push'
        env:
          KTO_SERVICE_KEY: ${{ secrets.KTO_SERVICE_KEY }}
          KOPIS_SERVICE_KEY: ${{ secrets.KOPIS_SERVICE_KEY }}
          CULTURE_SERVICE_KEY: ${{ secrets.CULTURE_SERVICE_KEY }}
          NAVER_APIHUB_CLIENT_ID: ${{ secrets.NAVER_APIHUB_CLIENT_ID }}
          NAVER_APIHUB_CLIENT_SECRET: ${{ secrets.NAVER_APIHUB_CLIENT_SECRET }}
        run: |
          if [ -n "$KTO_SERVICE_KEY" ] || [ -n "$KOPIS_SERVICE_KEY" ]; then
            python scripts/update_events.py
            python scripts/enrich_posters.py
            python scripts/enrich_official_sites.py
            python scripts/discover_official_posts.py
          else
            echo "API secrets not set: publishing existing manual data."
          fi

      - name: Refresh curated commercial musicals
        if: github.event_name != 'push'
        env:
          KOPIS_SERVICE_KEY: ${{ secrets.KOPIS_SERVICE_KEY }}
        run: python scripts/update_musicals.py

      - name: Refresh curated singer concerts
        if: github.event_name != 'push'
        env:
          KOPIS_SERVICE_KEY: ${{ secrets.KOPIS_SERVICE_KEY }}
        run: python scripts/update_concerts.py

      - name: Commit updated data
        if: github.event_name != 'push'
        run: |
          if ! git diff --quiet -- events.json sports.json musicals.json concerts.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add events.json sports.json musicals.json concerts.json
            git commit -m "chore: refresh event sports musical and concert listings"
            git push
          else
            echo "No data changes"
          fi

      - name: Prepare safe public files
        run: |
          mkdir -p _site
          cp index.html events.json sports.json sports.js sports.css musicals.json musicals.js musicals.css concerts.json concerts.js concerts.css food.html food.json food.js food.css site-nav.css _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - name: Verify GitHub Pages bundle
        run: |
          test -s _site/index.html
          test -s _site/events.json
          test -s _site/sports.json
          test -s _site/musicals.json
          test -s _site/musicals.js
          test -s _site/musicals.css
          test -s _site/concerts.json
          test -s _site/concerts.js
          test -s _site/concerts.css
          test -s _site/food.html
          test -s _site/food.json
          test -s _site/food.js
          test -s _site/food.css
          test -s _site/site-nav.css
          echo "GitHub Pages site files verified."
          ls -lh _site/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
