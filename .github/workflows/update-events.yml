
name: Update and publish Gangwon dates

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 22 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gangwon-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh event data
        if: github.event_name != 'push'
        env:
          KTO_SERVICE_KEY: ${{ secrets.KTO_SERVICE_KEY }}
          KOPIS_SERVICE_KEY: ${{ secrets.KOPIS_SERVICE_KEY }}
          CULTURE_SERVICE_KEY: ${{ secrets.CULTURE_SERVICE_KEY }}
        run: |
          if [ -n "$KTO_SERVICE_KEY" ] || [ -n "$KOPIS_SERVICE_KEY" ]; then
            python scripts/update_events.py
            python scripts/enrich_posters.py
            python scripts/enrich_official_sites.py
          else
            echo "API secrets not set: publishing existing manual data."
          fi

      - name: Commit updated data
        if: github.event_name != 'push'
        run: |
          if ! git diff --quiet -- events.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add events.json
            git commit -m "chore: refresh Gangwon event data"
            git push
          else
            echo "No data changes"
          fi

      - name: Prepare safe public files
        run: |
          mkdir -p _site
          cp index.html events.json _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
